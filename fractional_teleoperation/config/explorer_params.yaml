controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    qontrol_explorer:
      type: qontrol_controller/QontrolVelocityController
      auto_start: false
      is_chainable: true
      
    fractional_teleoperation_controller:
      type: fractional_teleoperation/FractionalTeleoperationController

qontrol_explorer:
  ros__parameters:
    # Base parameters
    robot_description_origin: robot_state_publisher
    tip_frame: ft_frame
    root_frame: base_link
    state_interface:
      - position
      - velocity
      - effort
    robot_command: position

    # Velocity parameters
    command_max_linear_velocity: 10.05
    command_max_angular_velocity: 1.0
    refresh_mapping: True
    open_loop: True
    input_topic_name: /fractional_teleoperation_controller/velocity_command
    regularisation_weight: 1e-2
    root_frame_control: True
    deadzone: 0.1
    velocity_limit: 0.5
    horizon: 15
    p_gain: 100.0
    lambda: 0.1
    points_collision: [0.0, -0.6, 0.0, 0.0, -0.6, 1.0]
    wall_constraint_horizon: 15
    d_secure: 0.2
    d_prevent: 0.2
    elbow_frame: "link_3"
    handle_frame: "link_5"

fractional_teleoperation_controller:
  ros__parameters:
    # Topic names (configurable for flexibility)
    teleop_cmd_input_topic: "/teleop_cmd"
    
    # Fractional-order parameters
    linear_alpha: 1.             # Linear fractional order (0 < alpha < 2)
    angular_alpha: 0.            # Angular fractional order (0 < alpha < 2)
    linear_fractional_offset_gain: 1.   # Manual linear gain in fractional law D^alpha x_d = K u
    angular_fractional_offset_gain: 1.  # Manual angular gain in fractional law D^alpha x_d = K u
    memory_length: 50            # Number of past samples for GL approximation
    output_velocity_scale: 1.0    # Overall output velocity scaling factor
    global_linear_velocity_saturation: 1.0   # Hard cap on ||linear velocity|| in m/s after transform/scale; 0 disables
    global_angular_velocity_saturation: 1.0  # Hard cap on ||angular velocity|| in rad/s after transform/scale; 0 disables

    # Output velocity One Euro filtering
    enable_linear_one_euro_filter: true
    linear_one_euro_frequency: 100.0
    linear_one_euro_mincutoff: 1.0
    linear_one_euro_beta: 0.1
    linear_one_euro_dcutoff: 1.0
    enable_angular_one_euro_filter: true
    angular_one_euro_frequency: 100.0
    angular_one_euro_mincutoff: 1.0
    angular_one_euro_beta: 0.1
    angular_one_euro_dcutoff: 1.0

    input_frame: "base"           # Reference frame: "base" or "ee"
    linear_normalize_gain_for_alpha: true   # Normalize linear K across alpha
    angular_normalize_gain_for_alpha: true  # Normalize angular K across alpha
    linear_alpha_gain_normalization_mode: "geometric_transition"   # "dt", "perceptual", or "geometric_transition"
    angular_alpha_gain_normalization_mode: "geometric_transition"  # "dt", "perceptual", or "geometric_transition"
    linear_v_max: 1.0             # Max velocity used for adaptive linear K (m/s)
    angular_v_max: 1.0            # Max velocity used for adaptive angular K
    linear_t_ref: 0.2             # Reference time for linear perceptual gain mode (s)
    angular_t_ref: 0.2            # Reference time for angular perceptual gain mode (s)
    linear_k_0: 0.              # Linear position-amplification endpoint used by geometric_transition
    angular_k_0: 0.2              # Angular position-amplification endpoint used by geometric_transition
    linear_k_1: 0.               # Linear velocity-gain endpoint used by geometric_transition
    angular_k_1: 0.2              # Angular velocity-gain endpoint used by geometric_transition
    
    # Dynamic alpha parameters
    use_dynamic_alpha_linear: false   # Enable dynamic alpha adjustment based on ||linear joystick||
    use_dynamic_alpha_angular: false  # Enable dynamic alpha adjustment based on ||angular joystick||
    linear_alpha_min: 0.1             # Linear alpha when ||linear joystick|| is below linear_l_0
    linear_alpha_max: 1.0             # Linear alpha when ||linear joystick|| is at or above linear_l_max
    linear_l_0: 0.6                   # Lower linear joystick norm threshold for alpha interpolation
    linear_l_max: 1.0                 # Upper linear joystick norm threshold for alpha interpolation
    angular_alpha_min: 0.1            # Angular alpha when ||angular joystick|| is below angular_l_0
    angular_alpha_max: 1.0            # Angular alpha when ||angular joystick|| is at or above angular_l_max
    angular_l_0: 0.6                  # Lower angular joystick norm threshold for alpha interpolation
    angular_l_max: 1.0                # Upper angular joystick norm threshold for alpha interpolation
    alpha_threshold: 0.001  # Minimum alpha used by the dynamic-alpha update logic

    # Fractional offset scaling (configurable ramp from 0 to max over scale_ramp_time)
    linear_offset_scale_max: 2.0      # Max linear fractional offset scale (reached after ramp_time of joystick activity)
    angular_offset_scale_max: 1.0     # Max angular fractional offset scale
    offset_ramp_time: 2.5             # Ramp duration (s); 0 = instantaneous
    offset_ramp_profile: "exponential"  # Ramp profile: linear, quadratic, smoothstep, sigmoid, exponential, inverse_exponential, tanh, cubic_hermite, step

    # Desired position is expressed as (x_des - x_ref), with slow drift of x_ref

    joystick_active_threshold: 0.01  # Joystick is considered "active" for ramp scaling when ||joystick_linear|| >= this value
    joystick_timeout_sec: 0.2        # If no new teleop command arrives within timeout, input is treated as zero (0 disables)
    linear_deadband: 0.01            # Per-axis deadband on linear joystick input before fractional integration
    angular_deadband: 0.03           # Per-axis deadband on angular joystick input before fractional integration
    kp_orient: 1.0                   # Proportional gain applied to orientation-error angular velocity command
    kd_orient: 0.1                   # Derivative gain applied to orientation-error angular velocity command
    snap_reference_on_release: false          # Snap x_ref to current x_des when joystick transitions from active to zero    

    use_reference_drift: false   # Enable slow drift of reference position towards current position to prevent long-term drift
    reference_drift_joystick_threshold: 0.025  # Drift only when ||joystick_linear|| >= this value
    reference_first_order_rate: 0.5          # Exponential blend rate (1/s), used only in "first_order" reference update mode
    reference_update_mode: "fractional"     # "first_order" or "fractional"
    reference_fractional_alpha: 0.5          # Fractional order used only in "fractional" reference update mode
    reference_fractional_gain: 0.5           # Gain of the fractional reference update law; not equivalent to first-order rate
    
    # Marker visualization
    enable_marker_visualization: true
    vel_cmd_marker_topic: "/vel_cmd_marker"
    vel_cmd_marker_frame_id: "base_link"
    vel_cmd_marker_scale_x: 0.03
    vel_cmd_marker_scale_y: 0.07
    vel_cmd_marker_scale_z: 0.07
    desired_position_marker_topic: "/desired_position_marker"
    desired_position_marker_scale: 0.07
    reference_position_marker_topic: "/reference_position_marker"
    reference_position_marker_scale: 0.07
    joystick_linear_marker_topic: "/joystick_linear_marker"
    
    
    # Robot interface configuration for explorer
    robot_type: "explorer_velocity"
    base_frame: "base_link"
    tool_frame: "ft_frame"
    use_topic_output: true
    vel_cmd_output_topic: "/fractional_teleoperation_controller/velocity_command"
    command_names:
      - "qontrol_explorer/linear_x"
      - "qontrol_explorer/linear_y"
      - "qontrol_explorer/linear_z"
      - "qontrol_explorer/angular_x"
      - "qontrol_explorer/angular_y"
      - "qontrol_explorer/angular_z"
    
